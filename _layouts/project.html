<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    {% if page.citation %}
    <meta name="citation_title" content="{{ page.citation.title | escape }}">
    {% for author in page.citation.authors %}
    <meta name="citation_author" content="{{ author | escape }}">
    {% endfor %}
    <meta name="citation_publication_date" content="{{ page.citation.publication_date | escape }}">
    <meta name="citation_journal_title" content="{{ page.citation.journal_title | escape }}">
    <meta name="citation_doi" content="{{ page.citation.doi | escape }}">
    <meta name="citation_abstract_html_url" content="{{ page.citation.abstract_html_url | escape }}">
    <meta name="citation_pdf_url" content="{{ page.citation.pdf_url | escape }}">
    {% endif %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body class="project-body">
    <nav class="project-topbar" aria-label="Project navigation">
      <a href="{{ "/" | relative_url }}">Back to homepage</a>
    </nav>
    <main class="project-page">
      {{ content }}
    </main>
  </body>
</html>
